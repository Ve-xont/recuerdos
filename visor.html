<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXONT · Tu Recuerdo Vivo</title>
    <!-- Agregamos la misma librería de descompresión -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --verde-profundo: #0f2b26;
            --ocre-calido: #c27d56;
            --fondo-oscuro: #121918;
            --tarjeta-fondo: #1b2423;
            --texto-principal: #f5f7f6;
            --texto-secundario: #a3b1af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--fondo-oscuro); color: var(--texto-principal); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        .fade-in-up { animation: fadeInUp 1.2s cubic-bezier(0.215, 0.610, 0.355, 1) forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
        header { width: 100%; padding: 30px 0; text-align: center; background: linear-gradient(to bottom, rgba(15,43,38,0.6), transparent); }
        .logo-texto { font-size: 26px; font-weight: 800; letter-spacing: 6px; color: var(--texto-principal); }
        .logo-texto span { color: var(--ocre-calido); }
        .slogan { font-size: 9px; letter-spacing: 4px; color: var(--texto-secundario); text-transform: uppercase; margin-top: 5px; }
        .main-container { max-width: 550px; width: 90%; padding-bottom: 60px; }
        .hero-section { text-align: center; margin: 25px 0; }
        .titulo-recuerdo { font-size: 30px; font-weight: 700; line-height: 1.3; color: #ffffff; margin-bottom: 8px; }
        .fecha-recuerdo { font-size: 15px; color: var(--ocre-calido); font-weight: 600; letter-spacing: 1px; }
        .historia-card { background-color: var(--tarjeta-fondo); padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 35px; border-top: 3px solid var(--ocre-calido); line-height: 1.7; font-size: 15px; color: #e2e8f0; }
        .galeria-columns { column-count: 2; column-gap: 12px; width: 100%; margin-bottom: 40px; }
        .foto-container { background-color: var(--tarjeta-fondo); margin-bottom: 12px; break-inside: avoid; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .foto-container img { width: 100%; height: auto; display: block; object-fit: cover; }
        .capsula-section { background-color: var(--tarjeta-fondo); border-radius: 16px; padding: 25px; margin-bottom: 35px; }
        .capsula-section h3 { font-size: 18px; color: var(--ocre-calido); margin-bottom: 15px; }
        .form-mensaje input, .form-mensaje textarea { width: 100%; padding: 12px; background: #24302e; border: 1px solid #2d3d3b; border-radius: 8px; color: var(--texto-principal); margin-bottom: 12px; font-size: 14px; }
        .form-mensaje textarea { height: 70px; resize: none; }
        .btn-enviar { background-color: var(--ocre-calido); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .lista-mensajes { margin-top: 25px; max-height: 200px; overflow-y: auto; border-top: 1px solid #2d3d3b; padding-top: 15px; }
        .mensaje-item { font-size: 13.5px; padding: 10px 0; border-bottom: 1px solid #24302e; }
        .mensaje-autor { font-weight: bold; color: var(--ocre-calido); }
        .banner-negocio { background: linear-gradient(135deg, #1b2423, #151c1b); padding: 25px; border-radius: 16px; text-align: center; border: 1px solid rgba(194,125,86,0.15); }
        .btn-whatsapp { display: inline-block; border: 2px solid var(--ocre-calido); color: var(--texto-principal); padding: 10px 24px; border-radius: 30px; font-size: 11px; font-weight: 700; text-decoration: none; letter-spacing: 1.5px; text-transform: uppercase; }
        #aviso-audio { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15,43,38,0.9); padding: 8px 16px; border-radius: 20px; font-size: 12px; color: var(--texto-principal); opacity: 0; transition: opacity 0.5s; z-index: 2000; }
    </style>
</head>
<body>

    <header class="fade-in-up">
        <div class="logo-texto">VEX<span>ONT</span></div>
        <div class="slogan">Encuentra tu eje</div>
    </header>

    <div class="main-container fade-in-up" style="animation-delay: 0.2s;">
        <div class="hero-section">
            <h1 class="titulo-recuerdo" id="lbl-titulo">Buscando Recuerdos...</h1>
            <div class="fecha-recuerdo" id="lbl-fecha"></div>
        </div>

        <p class="historia-card" id="lbl-historia"></p>
        
        <div class="galeria-columns" id="galeria-grid"></div>

        <div class="capsula-section">
            <h3>✍️ Cápsula del Tiempo</h3>
            <div class="form-mensaje">
                <input type="text" id="ins-nombre" placeholder="Tu nombre o parentesco">
                <textarea id="ins-texto" placeholder="Escribe un mensaje..."></textarea>
                <button class="btn-enviar" onclick="guardarMensaje()">Dejar mi Mensaje</button>
            </div>
            <div class="lista-mensajes" id="caja-mensajes"></div>
        </div>

        <div class="banner-negocio">
            <p>¿Te emociona volver a este lugar? Crea tu propio cuadro interactivo grabado en madera.</p>
            <a href="https://wa.me" target="_blank" class="btn-whatsapp">✨ CONSULTAR POR MI CUADRO</a>
        </div>
    </div>

    <div id="aviso-audio">🎵 Sonando música de fondo</div>
    <audio id="audio-elemento" loop></audio>

    <script>
        const audioNode = document.getElementById('audio-elemento');
        let audioIniciado = false;

        window.onload = function() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                // Leemos el parámetro comprimido "d"
                const dataParam = urlParams.get('d');

                if (!dataParam) return;

                // Descomprimimos los datos en el celular del cliente
                const datosString = LZString.decompressFromEncodedURIComponent(dataParam);
                const recuerdo = JSON.parse(datosString);

                document.getElementById('lbl-titulo').innerText = recuerdo.t || "Nuestro Momento";
                document.getElementById('lbl-fecha').innerText = recuerdo.f || "";
                document.getElementById('lbl-historia').innerText = recuerdo.h || "";

                if (recuerdo.m) {
                    audioNode.src = recuerdo.m;
                    audioNode.volume = 0.35;
                    const activarAudioContext = () => {
                        if (!audioIniciado) {
                            audioNode.play().then(() => {
                                audioIniciado = true;
                                document.getElementById('aviso-audio').style.opacity = '1';
                                setTimeout(() => document.getElementById('aviso-audio').style.opacity = '0', 3000);
                            }).catch(err => console.log(err));
                        }
                    };
                    document.addEventListener('click', activarAudioContext);
                    document.addEventListener('touchstart', activarAudioContext);
                    document.addEventListener('scroll', activarAudioContext);
                }

                const grid = document.getElementById('galeria-grid');
                if (recuerdo.i && recuerdo.i.length > 0) {
                    recuerdo.i.forEach(src => {
                        const box = document.createElement('div');
                        box.className = 'foto-container';
                        const img = document.createElement('img');
                        img.src = src;
                        box.appendChild(img);
                        grid.appendChild(box);
                    });
                }
                cargarMensajesLocales();
            } catch (e) {
                console.error(e);
            }
        };

        function guardarMensaje() {
            const nombre = document.getElementById('ins-nombre').value.trim();
            const texto = document.getElementById('ins-texto').value.trim();
            if (!nombre || !texto) return;

            let mensajes = JSON.parse(localStorage.getItem('vexont_mensajes') || '[]');
            mensajes.unshift({ autor: nombre, contenido: texto });
            localStorage.setItem('vexont_mensajes', JSON.stringify(mensajes));
            document.getElementById('ins-nombre').value = '';
            document.getElementById('ins-texto').value = '';
            cargarMensajesLocales();
        }

        function cargarMensajesLocales() {
            const caja = document.getElementById('caja-mensajes');
            caja.innerHTML = '';
            let mensajes = JSON.parse(localStorage.getItem('vexont_mensajes') || '[]');
            if(mensajes.length === 0) {
                caja.innerHTML = '<p style="font-size:12px; color:var(--texto-secundario); text-align:center;">No hay mensajes aún.</p>';
                return;
            }
            mensajes.forEach(m => {
                const item = document.createElement('div');
                item.className = 'mensaje-item';
                item.innerHTML = `<div class="mensaje-autor">${m.autor}</div><div>${m.contenido}</div>`;
                caja.appendChild(item);
            });
        }
    </script>
</body>
</html>
